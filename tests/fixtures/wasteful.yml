name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest-16-core
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 20, 22]
        os: [ubuntu-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v3
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - uses: docker/build-push-action@v5
        with:
          tags: app:latest

  e2e:
    runs-on: macos-latest
    needs: docker
    steps:
      - uses: actions/checkout@v3
      - run: npm ci
      - run: npm run e2e
